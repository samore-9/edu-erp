# .github/workflows/cd.yml
# ─────────────────────────────────────────────────────────────────────────────
# Continuous Deployment — runs ONLY after CI passes on the main branch.
# Never deploys from pull requests.
#
# Deployment strategy
# ───────────────────
# Frontend → Vercel CLI  (gives us explicit control and a deployment URL)
# Backend  → Render Deploy Hook  (single HTTPS POST triggers a Render deploy)
#
# Why not rely on Vercel/Render's native Git integration?
# If you have Vercel's "Connected Git repository" auto-deploy enabled AND
# this workflow also deploys, you get duplicate deployments on every push.
# Choose ONE approach. This workflow assumes you have DISABLED auto-deploy
# in the Vercel dashboard (Project → Settings → Git → disable auto-deploy)
# and in Render (service → Settings → Auto-Deploy → No).
# ─────────────────────────────────────────────────────────────────────────────

name: CD

on:
  workflow_run:
    workflows: [CI]          # exact name from ci.yml
    types: [completed]
    branches: [main]         # only fire for main-branch CI runs

permissions:
  contents: read

# Only one production deployment at a time
concurrency:
  group: cd-production
  cancel-in-progress: false  # do NOT cancel an in-flight deploy

jobs:
  # ── Guard: only proceed if CI passed ─────────────────────────────────────
  check-ci:
    name: Check CI result
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI passed — proceeding to deploy
        run: echo "CI succeeded. Starting deployment."

  # ── Deploy Frontend → Vercel ──────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: check-ci
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pull Vercel project settings (.vercel/project.json) so CLI knows
      # which project and org to deploy to — no manual vercel.json needed.
      - name: Pull Vercel environment & project info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Build via Vercel CLI so it uses the same build pipeline as Vercel's
      # own servers, honoring vercel.json / framework presets.
      - name: Build project using Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy pre-built output to Vercel (production)
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅  Deployed to $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Deploy Backend → Render ───────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: check-ci

    steps:
      - name: Trigger Render deploy hook
        # A single HTTPS POST to the deploy hook URL starts a new Render build.
        # The hook URL is stored as a secret — it IS the credential, never log it.
        run: |
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ]; then
            echo "✅  Render deploy triggered (HTTP $HTTP_STATUS)"
          else
            echo "❌  Render deploy hook returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Wait for Render deploy to start
        # Give Render a moment to queue the build before we finish the job.
        # The actual build happens on Render's side — we don't block on it.
        run: |
          echo "Render deployment started. Monitor progress at:"
          echo "  https://dashboard.render.com"
