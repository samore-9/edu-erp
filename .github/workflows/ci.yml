# .github/workflows/ci.yml
# ─────────────────────────────────────────────────────────────────────────────
# Continuous Integration — runs on every push to main AND on pull requests
# targeting main. Installs, lints (if available), and builds both workspaces.
# A failing step fails the entire workflow and blocks the CD pipeline.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: read-only by default; individual jobs can request more
permissions:
  contents: read

# Cancel an in-progress run on the same branch when a newer commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend — Install & Verify
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      # ── Syntax check every JS file (no test framework needed) ────────────
      - name: Syntax check — all backend JS files
        run: |
          echo "Checking syntax of all JS files..."
          find . -name "*.js" \
               -not -path "./node_modules/*" \
               -not -path "./.git/*" | while read f; do
            node --check "$f" && echo "✅  $f" || { echo "❌  $f"; exit 1; }
          done

      # ── Health-check: server file resolves without starting ───────────────
      - name: Verify server.js resolves (dry-run)
        run: node --check server.js
        env:
          # Provide dummy env so dotenv doesn't throw on missing .env
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: ci_dummy_secret
          JWT_EXPIRE: 7d
          NODE_ENV: test

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Install & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      # ── Production build ──────────────────────────────────────────────────
      # REACT_APP_API_URL must point to the Render backend in production.
      # We pass a placeholder here so the build doesn't fail on missing env.
      - name: Build React app
        run: npm run build
        env:
          REACT_APP_API_URL: https://placeholder-for-ci.example.com
          # Prevents react-scripts from treating warnings as errors
          CI: false

      - name: Verify build output exists
        run: |
          test -d build && echo "✅  build/ directory created" || \
          { echo "❌  build/ directory missing — build failed silently"; exit 1; }
